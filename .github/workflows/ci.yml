name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify committed build output
        run: |
          git diff --exit-code -- lib
          test -z "$(git ls-files --others --exclude-standard -- lib)"
      - name: Verify package entries and archive
        run: |
          node scripts/check-package.mjs
          pnpm pack --pack-destination "$RUNNER_TEMP"
