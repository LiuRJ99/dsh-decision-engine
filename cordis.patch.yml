# dsh-decision-engine bundle patch: one host-plane row that brings the decision
# layer, the Laya provider, the `decision_decide` / `decision_run` tools, and the
# `decision-control` skill into a profile.
#
# The row is host-plane because the layer is a singleton service
# (`ctx.decisionEngine`) plus host-registered capabilities, so every preset in
# the profile (standard, creator/cordis, code) sees them. The environment
# adapters do not own browser or computer permission: they dispatch through the
# host's registered `browser_*` / `computer_use_*` tools, so the session-lazy
# capability gate stays the single authority on whether a capability is
# reachable.
#
# The relative `name` is anchored beside this package's patch file by DSH.
# A file entry also lets the Web client discover this package's `dsh.client`.
#
# Provider-private settings belong under `providers.<id>` — never as top-level
# keys — so a second model family can be added without touching this row's
# schema. `providers.laya.modelDir` has no portable default: leave it unset and
# the SDK resolves its own cached bundle, or point it at a local export
# directory from the profile's own cordis.patch.yml.

- insert:
    - id: decision-engine
      # The root export is the host-free composition surface (importable
      # without a DSH process); the Cordis `apply` entry lives here.
      name: ./lib/plugin.js
      config:
        enabled: true
        defaultProvider: laya

        providers:
          laya:
            enabled: true
            # Optional. `cpu` is the portable default; `coreml` is faster on
            # Apple silicon when the ONNX build supports it.
            device: cpu

        runtime:
          # A NORMALIZED confidence floor: the engine compares it only with
          # results whose confidenceKind is "normalized". The Laya provider
          # reports "provider_raw" (its entropy confidence does not track
          # decision quality — see examples/laya-head-calibration.mjs), so this
          # value never gates a Laya decision. Raise it only for a provider that
          # declares normalized confidence.
          confidenceThreshold: 0.55
          maxSteps: 10
          maxDurationMs: 120000
          noProgressLimit: 3
          repeatedDecisionLimit: 3

        browser:
          enabled: true

        computer:
          enabled: true
