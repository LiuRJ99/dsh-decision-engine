<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金币走廊</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #edf2ff; background: #10182a; font: 18px system-ui, sans-serif; }
  main { width: min(860px, 88vw); }
  h1 { font-size: 48px; margin-bottom: 12px; }
  p { color: #aebdd6; }
  .stats { display: flex; gap: 48px; margin: 32px 0; }
  strong { font-size: 36px; display: block; color: #fff; }
  .board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; margin: 30px 0; }
  .cell { aspect-ratio: 1; display: grid; place-items: center; background: #1e2c46; border-radius: 14px; color: #ffd165; font-size: 32px; }
  .collected { background: #205849; color: #9ce5c6; }
  #status { color: #9ce5c6; }
</style>
<main>
  <p>自主游戏演示</p>
  <h1>金币走廊</h1>
  <p>向右前进，收集全部 20 枚金币。每枚金币得 10 分。</p>
  <div class="stats"><div>得分<strong id="score">0</strong></div><div>已收集<strong id="count">0 / 20</strong></div></div>
  <div class="board" id="board" aria-label="金币收集进度"></div>
  <p id="status">等待控制器接管游戏…</p>
</main>
<script>
  const board = document.getElementById('board');
  const cells = Array.from({ length: 20 }, () => {
    const cell = document.createElement('div'); cell.className = 'cell'; cell.textContent = '●'; board.append(cell); return cell;
  });
  async function refresh() {
    try {
      const response = await fetch('/environment/state');
      if (!response.ok) throw new Error('unavailable');
      const snapshot = await response.json();
      document.getElementById('score').textContent = snapshot.state.score;
      document.getElementById('count').textContent = snapshot.state.position + ' / 20';
      cells.forEach((cell, index) => { cell.className = index < snapshot.state.position ? 'cell collected' : 'cell'; cell.textContent = index < snapshot.state.position ? '✓' : '●'; });
      document.getElementById('status').textContent = snapshot.done ? '游戏完成！最终得分：' + snapshot.result.score : snapshot.state.position ? '控制器正在收集金币…' : '等待控制器接管游戏…';
    } catch { document.getElementById('status').textContent = '游戏连接已断开。'; }
    setTimeout(refresh, 200);
  }
  refresh();
</script>
</html>
